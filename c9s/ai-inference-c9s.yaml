    """Disaggregated LLM inference: prefill on one worker, decode on the other, KV cache over RoCEv2.

      --role prefill     process the prompt, build the real KV cache, push it to the decode worker (rank 0, hosts the store)
      --role decode      receive the KV cache into registered memory, rebuild it, generate tokens (rank 1)
      --role colocated   prefill and decode in one process with no network: the reference run

    Greedy decoding, fixed seed and thread count, so the colocated and disaggregated runs must produce identical
    tokens and an identical KV byte checksum. With --kv-dtype fp16 the colocated run quantizes the cache at the same
    point where the disaggregated run does, so the comparison stays exact.

    Timeline (wall clock, both workers share the host clock):
      t_req       the request enters prefill
      prefill_ms  forward pass over the prompt (includes layer-wise pushes when --mode layerwise)
      kv_ready    the last KV byte is in decode memory (immediate of the last WRITE received)
      ttft_ms     max(kv_ready, first token published) - t_req: decode emits token 0 once it holds the whole cache
    """
    import argparse
    import json
    import os
    import statistics
    import sys
    import time
    from datetime import timedelta

    import torch

    sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
    import kvlayout as kv  # noqa: E402

    MODEL_DIR = os.environ.get("MODEL_DIR", "/models/SmolLM2-135M")
    PROMPT_FILE = os.environ.get("PROMPT_FILE", "/lab/prompts/source.txt")


    def log(msg):
        print(msg, flush=True)


    def kvs(**kw):
        return " ".join(f"{k}={v:.2f}" if isinstance(v, float) else f"{k}={v}" for k, v in kw.items())


    def parse():
        p = argparse.ArgumentParser()
        p.add_argument("--role", choices=["prefill", "decode", "colocated"], default=os.environ.get("ROLE", "colocated"))
        p.add_argument("--prompt-tokens", type=int, default=128)
        p.add_argument("--max-new-tokens", type=int, default=16)
        p.add_argument("--kv-dtype", choices=["fp32", "fp16"], default="fp32")
        p.add_argument("--mode", choices=["bulk", "layerwise"], default="bulk")
        p.add_argument("--channels", type=int, default=2)
        p.add_argument("--transport", choices=["roce", "tcp"], default="roce")
        p.add_argument("--requests", type=int, default=1)
        p.add_argument("--threads", type=int, default=int(os.environ.get("TORCH_THREADS", "4")))
        p.add_argument("--control", choices=["none", "zero-kv"], default="none",
                       help="decode only: ignore the received KV and use zeros, to show the KV carries the state")
        p.add_argument("--seed", type=int, default=0)
        return p.parse_args()


    def load():
        from transformers import AutoModelForCausalLM, AutoTokenizer
        tok = AutoTokenizer.from_pretrained(MODEL_DIR)
        model = AutoModelForCausalLM.from_pretrained(MODEL_DIR, torch_dtype=torch.float32).eval()
        return tok, model


    def prompt_ids(tok, n):
        ids = tok(open(PROMPT_FILE).read(), return_tensors="pt").input_ids
        if ids.shape[1] < n:
            raise SystemExit(f"prompt source has only {ids.shape[1]} tokens, need {n}")
        return ids[:, :n]


    def prefill_forward(model, ids, cache, hooks=()):
        handles = [model.model.layers[i].register_forward_hook(h) for i, h in hooks]
        try:
            out = model(input_ids=ids, past_key_values=cache, use_cache=True, num_logits_to_keep=1)
        finally:
            for h in handles:
                h.remove()
        return int(out.logits[0, -1].argmax())


    def decode_loop(model, tok, cache, first, n_new):
        """Greedy decode. Token 0 is `first` (already known); returns ids and per-token step times in ms."""
        ids, steps = [first], []
        cur = first
        for _ in range(n_new - 1):
            t = time.perf_counter()
            out = model(input_ids=torch.tensor([[cur]]), past_key_values=cache, use_cache=True)
            cur = int(out.logits[0, -1].argmax())
            steps.append((time.perf_counter() - t) * 1000)
            ids.append(cur)
        return ids, steps


    def itl_summary(steps):
        if not steps:
            return {}
        s = sorted(steps)
        return dict(itl_mean_ms=statistics.mean(steps), itl_p50_ms=s[len(s) // 2], itl_max_ms=s[-1])


    def run_colocated(args, tok, model):
        for r in range(args.requests):
            ids = prompt_ids(tok, args.prompt_tokens)
            spec = kv.spec_from_config(model.config, ids.shape[1], args.kv_dtype)
            t_req = time.perf_counter()
            cache = kv.DynamicCache()
            first = prefill_forward(model, ids, cache)
            prefill_ms = (time.perf_counter() - t_req) * 1000
            # Same pack/unpack path as the handoff, so fp16 quantization is applied identically.
            slab = torch.zeros(spec.total_bytes, dtype=torch.uint8).numpy()
            t = time.perf_counter()
            kv.pack_cache(slab, spec, cache)
            pack_ms = (time.perf_counter() - t) * 1000
            t = time.perf_counter()
            cache = kv.unpack_cache(slab, spec)
            unpack_ms = (time.perf_counter() - t) * 1000
            gen, steps = decode_loop(model, tok, cache, first, args.max_new_tokens)
            log(f"role=colocated req={r} " + kvs(prompt_tokens=spec.tokens, kv_dtype=spec.dtype, kv_bytes=spec.total_bytes,
                prefill_ms=prefill_ms, pack_ms=pack_ms, unpack_ms=unpack_ms, ttft_ms=prefill_ms,
                kv_crc32=f"{kv.slab_crc32(slab):08x}", kv_checksum=f"{kv.slab_checksum(slab, spec):.6f}",
                **itl_summary(steps)))
            log(f"role=colocated req={r} generated_ids={gen}")
            log(f"role=colocated req={r} text={tok.decode(gen)!r}")


    def make_transport(args, store):
        if args.transport == "roce":
            from kv_transport import RoceTransport
            return RoceTransport(store, args.role, os.environ["ROCE_DEV"], channels=args.channels, log=log)
        from kv_transport import TcpTransport
        return TcpTransport(store, args.role, log=log)


    def run_prefill(args, tok, model, store, tr):
        for r in range(args.requests):
            ids = prompt_ids(tok, args.prompt_tokens)
            spec = kv.spec_from_config(model.config, ids.shape[1], args.kv_dtype)
            t_req = time.time()
            store.set(f"meta/{r}", json.dumps(dict(spec=spec.to_dict(), mode=args.mode, channels=args.channels,
                                                   transport=args.transport, t_req=t_req)))
            slab = tr.open_request(r, spec.total_bytes)
            cache = kv.DynamicCache()
            pack_ms = 0.0
            push_t = {}

            def layer_hook(i):
                def hook(module, inputs, output):
                    nonlocal pack_ms
                    t = time.perf_counter()
                    kv.pack_layer(slab, spec, i, cache.key_cache[i], cache.value_cache[i])
                    pack_ms += (time.perf_counter() - t) * 1000
                    tr.push(r, i * spec.layer_bytes, spec.layer_bytes, i)
                    push_t[i] = time.perf_counter()
                return hook

            hooks = [(i, layer_hook(i)) for i in range(spec.layers)] if args.mode == "layerwise" else []
            t_c = time.perf_counter()
            first = prefill_forward(model, ids, cache, hooks)
            prefill_ms = (time.perf_counter() - t_c) * 1000
            store.set(f"first/{r}", str(first))
            if args.mode == "bulk":
                t = time.perf_counter()
                kv.pack_cache(slab, spec, cache)
                pack_ms = (time.perf_counter() - t) * 1000
                tr.push(r, 0, spec.total_bytes, 0)
            t_pushed = time.perf_counter()
            tr.flush()
            push_done_ms = (time.perf_counter() - t_c) * 1000
            crc = kv.slab_crc32(slab)
            log(f"role=prefill req={r} " + kvs(prompt_tokens=spec.tokens, kv_dtype=spec.dtype, kv_bytes=spec.total_bytes,
                bytes_per_token=spec.bytes_per_token, mode=args.mode, channels=args.channels, transport=args.transport,
                prefill_ms=prefill_ms, pack_ms=pack_ms, push_done_ms=push_done_ms,
                exposed_transfer_ms=push_done_ms - prefill_ms - (pack_ms if args.mode == "bulk" else 0.0),
                kv_crc32=f"{crc:08x}", kv_checksum=f"{kv.slab_checksum(slab, spec):.6f}", first_token=first))
            done = json.loads(store.get(f"done/{r}"))
            log(f"role=prefill req={r} " + kvs(**done))


    def run_decode(args, tok, model, store, tr):
        for r in range(args.requests):
            meta = json.loads(store.get(f"meta/{r}"))
            spec = kv.KVSpec.from_dict(meta["spec"])
            slab = tr.open_request(r, spec.total_bytes)
            expected = spec.layers * meta["channels"] if meta["mode"] == "layerwise" else meta["channels"]
            if args.control == "zero-kv":
                slab[:] = 0
                first = int(store.get(f"first/{r}"))
                tr.wait_data(expected)  # still drain the transfer so the sender completes, then discard it
                slab[:] = 0
                t_kv = time.time()
                info = {"t_first": t_kv, "messages": expected}
            else:
                info = tr.wait_data(expected)
                t_kv = info["t_last"]
                first = int(store.get(f"first/{r}"))
            t_first = time.time()
            t_ready = max(t_kv, t_first)
            crc = kv.slab_crc32(slab)
            t = time.perf_counter()
            cache = kv.unpack_cache(slab, spec)
            unpack_ms = (time.perf_counter() - t) * 1000
            gen, steps = decode_loop(model, tok, cache, first, args.max_new_tokens)
            res = dict(prompt_tokens=spec.tokens, kv_dtype=spec.dtype, kv_bytes=spec.total_bytes, mode=meta["mode"],
                       channels=meta["channels"], transport=meta["transport"], control=args.control,
                       kv_ready_ms=(t_kv - meta["t_req"]) * 1000,
                       ttft_ms=(t_ready - meta["t_req"]) * 1000, unpack_ms=unpack_ms,
                       writes_received=info["messages"], kv_crc32=f"{crc:08x}",
                       kv_checksum=f"{kv.slab_checksum(slab, spec):.6f}", **itl_summary(steps))
            log(f"role=decode req={r} " + kvs(**res))
            log(f"role=decode req={r} generated_ids={gen}")
            log(f"role=decode req={r} text={tok.decode(gen)!r}")
            store.set(f"done/{r}", json.dumps(dict(decode_ttft_ms=round(res["ttft_ms"], 2), decode_kv_crc32=res["kv_crc32"],
                                                   decode_unpack_ms=round(unpack_ms, 2))))


    def main():
        args = parse()
        torch.set_num_threads(args.threads)
        torch.manual_seed(args.seed)
        t = time.perf_counter()
        tok, model = load()
        cfg = model.config
        log(f"role={args.role} model={os.path.basename(MODEL_DIR)} layers={cfg.num_hidden_layers} "
            f"kv_heads={cfg.num_key_value_heads} head_dim={cfg.hidden_size // cfg.num_attention_heads} "
            f"load_s={time.perf_counter() - t:.1f} threads={args.threads} "
            f"weights_checksum={kv.weights_checksum(model):.6f}")
        if args.role == "colocated":
            return run_colocated(args, tok, model)

        from torch.distributed import TCPStore
        store = TCPStore(os.environ.get("MASTER_ADDR", "10.10.1.2"), int(os.environ.get("MASTER_PORT", "29500")),
                         world_size=2, is_master=args.role == "prefill", timeout=timedelta(seconds=600),
                         wait_for_workers=True)
        tr = make_transport(args, store)
        (run_prefill if args.role == "prefill" else run_decode)(args, tok, model, store, tr)


    if __name__ == "__main__":
        with torch.no_grad():
            main()

  app-kv_transport.py: |-
    """KV-cache transports between the prefill worker (rank 0) and the decode worker (rank 1).

    RoceTransport pushes the slab with RDMA WRITE over RC queue pairs (libibverbs, Soft-RoCE `rxe`), the
    "WRITE (push)" example of Learning Byte 04:

      * decode allocates and registers the destination slab and publishes (addr, rkey) in the TCP store,
      * prefill pushes byte ranges of its own registered slab with RDMA WRITE WITH IMMEDIATE,
      * each range is striped across `channels` RC QPs, and every QP has its own UDP source port, so the
        fabric can ECMP-hash the channels onto different spines,
      * the immediate (the layer index) tells decode that a range landed; decode counts completions.

    TcpTransport sends the same slab over one TCP connection, for comparison.

    Only bootstrap and metadata use the TCP store, as NCCL and NIXL bootstrap over sockets.
    """
    import ctypes
    import glob
    import json
    import random
    import socket
    import time

    import numpy as np

    ROCE_DSCP = 26
    ECT0 = 0b10
    PORT = 1
    TCP_DATA_PORT = 29600
    POLL_SLEEP = 0.0005


    def stripes(offset, nbytes, parts):
        """Split [offset, offset+nbytes) into `parts` contiguous ranges (last ones may be shorter or empty)."""
        size = -(-nbytes // parts)
        out = []
        for i in range(parts):
            lo = offset + i * size
            n = max(0, min(size, offset + nbytes - lo))
            if n:
                out.append((i, lo, n))
        return out


    def roce_v2_ipv4_gid_index(dev):
        base = f"/sys/class/infiniband/{dev}/ports/{PORT}"
        for path in sorted(glob.glob(f"{base}/gids/*"), key=lambda p: int(p.rsplit("/", 1)[1])):
            idx = int(path.rsplit("/", 1)[1])
            try:
                gid = open(path).read().strip()
                gtype = open(f"{base}/gid_attrs/types/{idx}").read().strip()
            except OSError:
                continue
            if gid.startswith("0000:0000:0000:0000:0000:ffff") and "v2" in gtype:
                return idx
        raise RuntimeError(f"no RoCE v2 IPv4 GID on {dev}")


    class RoceTransport:
        def __init__(self, store, role, dev, channels=2, tclass=(ROCE_DSCP << 2) | ECT0, log=print):
            import pyverbs.enums as e
            from pyverbs.addr import GID, AHAttr, GlobalRoute
            from pyverbs.cq import CQ
            from pyverbs.device import Context
            from pyverbs.pd import PD
            from pyverbs.qp import QP, QPAttr, QPCap, QPInitAttr

            self.e, self.store, self.role, self.channels, self.log = e, store, role, channels, log
            rank = 0 if role == "prefill" else 1
            self.ctx = Context(name=dev)
            self.pd = PD(self.ctx)
            self.cq = CQ(self.ctx, 4096)
            self.access = e.IBV_ACCESS_LOCAL_WRITE | e.IBV_ACCESS_REMOTE_WRITE
            self.imm_sink = self._mr(64, e.IBV_ACCESS_LOCAL_WRITE)
            self.gid_index = roce_v2_ipv4_gid_index(dev)
            gid = self.ctx.query_gid(PORT, self.gid_index)

            cap = QPCap(max_send_wr=512, max_recv_wr=1024, max_send_sge=1, max_recv_sge=1)
            self.qps = [QP(self.pd, QPInitAttr(qp_type=e.IBV_QPT_RC, scq=self.cq, rcq=self.cq, cap=cap))
                        for _ in range(channels)]
            psn = [random.randrange(1 << 24) for _ in range(channels)]
            me = dict(gid=str(gid), qpn=[q.qp_num for q in self.qps], psn=psn)
            store.set(f"roce/{rank}", json.dumps(me))
            peer = json.loads(store.get(f"roce/{1 - rank}"))

            for i, qp in enumerate(self.qps):
                attr = QPAttr(port_num=PORT)
                attr.qp_access_flags = self.access
                qp.to_init(attr)
                gr = GlobalRoute(dgid=GID(peer["gid"]), sgid_index=self.gid_index, hop_limit=64, traffic_class=tclass)
                attr.ah_attr = AHAttr(port_num=PORT, is_global=1, gr=gr)
                attr.path_mtu = e.IBV_MTU_4096
                attr.dest_qp_num = peer["qpn"][i]
                attr.rq_psn = peer["psn"][i]
                attr.max_dest_rd_atomic = 1
                attr.min_rnr_timer = 12
                qp.to_rtr(attr)
                attr.sq_psn = psn[i]
                attr.timeout = 14
                attr.retry_cnt = 7
                attr.rnr_retry = 7
                attr.max_rd_atomic = 1
                qp.to_rts(attr)
                for _ in range(256):
                    qp.post_recv(self._recv_wr())
            self.qpn_to_ch = {q.qp_num: i for i, q in enumerate(self.qps)}
            store.set(f"roce/ready/{rank}", "1")
            store.get(f"roce/ready/{1 - rank}")
            self.slab_mr = None
            self.remote = None
            self.inflight = 0
            self.wr_seq = 0
            log(f"roce dev={dev} gid_index={self.gid_index} gid={gid} qpn={me['qpn']} peer_gid={peer['gid']} "
                f"peer_qpn={peer['qpn']} channels={channels} tclass=0x{tclass:02x} (DSCP {tclass >> 2}, ECN {tclass & 3})")

        def _mr(self, nbytes, access):
            from pyverbs.mr import MR
            return MR(self.pd, nbytes, access)

        def _recv_wr(self):
            from pyverbs.wr import SGE, RecvWR
            return RecvWR(num_sge=1, sg=[SGE(self.imm_sink.buf, 64, self.imm_sink.lkey)])

        def open_request(self, rid, nbytes):
            """Allocate and register the slab. Decode publishes (addr, rkey) for the sender."""
            if self.slab_mr is not None:
                self.slab_mr.close()
            self.slab_mr = self._mr(nbytes, self.access)
            self.remote = None
            if self.role == "decode":
                self.store.set(f"mr/{rid}", json.dumps([self.slab_mr.buf, self.slab_mr.rkey]))
            raw = (ctypes.c_ubyte * nbytes).from_address(self.slab_mr.buf)
            return np.frombuffer(raw, dtype=np.uint8)

        def push(self, rid, offset, nbytes, tag):
            """RDMA WRITE WITH IMM of slab[offset:offset+nbytes], striped over the channels. imm_data = tag."""
            from pyverbs.wr import SGE, SendWR
            if self.remote is None:
                self.remote = json.loads(self.store.get(f"mr/{rid}"))
            raddr, rkey = self.remote
            for ch, lo, n in stripes(offset, nbytes, self.channels):
                self.wr_seq += 1
                wr = SendWR(wr_id=self.wr_seq, opcode=self.e.IBV_WR_RDMA_WRITE_WITH_IMM, num_sge=1,
                            sg=[SGE(self.slab_mr.buf + lo, n, self.slab_mr.lkey)],
                            send_flags=self.e.IBV_SEND_SIGNALED)
                wr.imm_data = tag
                wr.set_wr_rdma(rkey, raddr + lo)
                self.qps[ch].post_send(wr)
                self.inflight += 1

        def _poll(self, on_recv=None):
            n, wcs = self.cq.poll(num_entries=64)
            for wc in wcs[:n]:
                if wc.status != self.e.IBV_WC_SUCCESS:
                    raise RuntimeError(f"WC error status={wc.status} opcode={wc.opcode} qpn={wc.qp_num}")
                if wc.opcode == self.e.IBV_WC_RDMA_WRITE:
                    self.inflight -= 1
                elif wc.opcode == self.e.IBV_WC_RECV_RDMA_WITH_IMM:
                    self.qps[self.qpn_to_ch[wc.qp_num]].post_recv(self._recv_wr())
                    if on_recv:
                        on_recv(wc.imm_data)
            return n

        def flush(self, timeout=300.0):
            """Sender: wait until every WRITE is acknowledged by the responder (RC ACK)."""
            deadline = time.monotonic() + timeout
            while self.inflight:
                if not self._poll():
                    time.sleep(POLL_SLEEP)   # the two workers share one host: do not burn a core while waiting
                    if time.monotonic() > deadline:
                        raise TimeoutError(f"{self.inflight} WRITEs unacknowledged")

        def wait_data(self, expected, timeout=300.0):
            """Receiver: wait for `expected` WRITE-with-immediate completions. Returns arrival timestamps."""
            got, first, per_tag = 0, None, {}

            def on_recv(tag):
                nonlocal got, first
                got += 1
                first = first or time.time()
                per_tag[tag] = per_tag.get(tag, 0) + 1

            deadline = time.monotonic() + timeout
            while got < expected:
                if not self._poll(on_recv):
                    time.sleep(POLL_SLEEP)
                    if time.monotonic() > deadline:
                        raise TimeoutError(f"received {got}/{expected} completions")
            return {"t_first": first, "t_last": time.time(), "messages": got, "tags": len(per_tag)}

        def close_request(self):
            pass


    class TcpTransport:
        def __init__(self, store, role, bind_addr="10.10.2.2", peer_addr="10.10.2.2", log=print):
            self.store, self.role, self.log = store, role, log
            self.slab = None
            if role == "decode":
                srv = socket.socket()
                srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                srv.bind((bind_addr, TCP_DATA_PORT))
                srv.listen(1)
                store.set("tcp/ready", "1")
                self.sock, peer = srv.accept()
                srv.close()
                log(f"tcp data connection from {peer[0]}:{peer[1]}")
            else:
                store.get("tcp/ready")
                self.sock = socket.create_connection((peer_addr, TCP_DATA_PORT))
                log(f"tcp data connection to {peer_addr}:{TCP_DATA_PORT} from port {self.sock.getsockname()[1]}")
            self.sock.setsockopt(socket.IPPROTO_TCP, socket.TCP_NODELAY, 1)

        def open_request(self, rid, nbytes):
            self.slab = np.zeros(nbytes, dtype=np.uint8)
            return self.slab

        def push(self, rid, offset, nbytes, tag):
            self.sock.sendall(memoryview(self.slab)[offset:offset + nbytes])

        def flush(self, timeout=300.0):
            pass

        def wait_data(self, expected_unused, timeout=300.0):
            mv, n, first = memoryview(self.slab), 0, None
            while n < len(self.slab):
                got = self.sock.recv_into(mv[n:], min(len(self.slab) - n, 1 << 20))
                if not got:
                    raise ConnectionError("peer closed during KV transfer")
                first = first or time.time()
                n += got
            return {"t_first": first, "t_last": time.time(), "messages": 1, "tags": 1}

  app-kvlayout.py: |-
    """KV-cache slab layout shared by the prefill and decode workers.

    The Hugging Face cache for layer L holds K and V tensors of shape [1, kv_heads, tokens, head_dim].
    The slab stores them layer after layer, K then V, each C-contiguous:

        slab = [layer 0: K | V][layer 1: K | V] ... [layer N-1: K | V]

    so one layer is one contiguous byte range (what a layer-wise RDMA WRITE pushes) and the whole slab is one
    contiguous range (what a bulk RDMA WRITE pushes). The size is analytic:

        bytes = 2 * layers * kv_heads * head_dim * tokens * dtype_bytes

    The slab memory itself is allocated by the transport (an RDMA-registered buffer, or a plain buffer for TCP);
    this module only gives tensor views over it.
    """
    import zlib
    from dataclasses import asdict, dataclass

    import numpy as np
    import torch
    from transformers import DynamicCache

    DTYPES = {"fp32": (torch.float32, 4), "fp16": (torch.float16, 2)}


    @dataclass
    class KVSpec:
        layers: int
        kv_heads: int
        head_dim: int
        tokens: int
        dtype: str  # "fp32" | "fp16"

        @property
        def torch_dtype(self):
            return DTYPES[self.dtype][0]

        @property
        def elem_bytes(self):
            return DTYPES[self.dtype][1]

        @property
        def layer_bytes(self):
            return 2 * self.kv_heads * self.tokens * self.head_dim * self.elem_bytes

        @property
        def total_bytes(self):
            return self.layers * self.layer_bytes

        @property
        def bytes_per_token(self):
            return 2 * self.layers * self.kv_heads * self.head_dim * self.elem_bytes

        def to_dict(self):
            return asdict(self)

        @staticmethod
        def from_dict(d):
            return KVSpec(**d)


    def spec_from_config(cfg, tokens, dtype):
        head_dim = getattr(cfg, "head_dim", None) or cfg.hidden_size // cfg.num_attention_heads
        return KVSpec(cfg.num_hidden_layers, cfg.num_key_value_heads, head_dim, tokens, dtype)


    def layer_view(slab, spec, layer):
        """Tensor [2, kv_heads, tokens, head_dim] (index 0 = K, 1 = V) over the slab bytes of one layer."""
        off = layer * spec.layer_bytes
        raw = torch.from_numpy(slab[off:off + spec.layer_bytes])
        return raw.view(spec.torch_dtype).reshape(2, spec.kv_heads, spec.tokens, spec.head_dim)


    def pack_layer(slab, spec, layer, k, v):
        """Copy one layer's K and V ([1, kv_heads, tokens, head_dim]) into the slab, casting to the wire dtype."""
        t = layer_view(slab, spec, layer)
        t[0].copy_(k[0])
        t[1].copy_(v[0])


    def pack_cache(slab, spec, cache):
        for i in range(spec.layers):
            pack_layer(slab, spec, i, cache.key_cache[i], cache.value_cache[i])


    def unpack_cache(slab, spec):
        """Rebuild a DynamicCache (fp32, the model dtype) from the slab."""
        layers = []
        for i in range(spec.layers):
            t = layer_view(slab, spec, i).to(torch.float32)
            layers.append((t[0].unsqueeze(0).contiguous(), t[1].unsqueeze(0).contiguous()))
        return DynamicCache.from_legacy_cache(tuple(layers))


    def slab_crc32(slab):
        """Exact byte integrity of the transferred slab."""
        return zlib.crc32(memoryview(slab)) & 0xFFFFFFFF


    def slab_checksum(slab, spec):
        """Sum of all KV values in float64, the analogue of the training lab's gradient checksum."""
        return float(torch.from_numpy(slab[:spec.total_bytes]).view(spec.torch_dtype).double().sum())


    def weights_checksum(model):
        return float(sum(p.double().sum() for p in model.parameters()))

  prompts-source.txt: |-
    A data center network for machine learning is built differently from one for web traffic. A web request is a short conversation between a client and a server, and thousands of independent flows share every link. A backend network for AI is dominated by a few very large flows that run between accelerators for the whole life of a job. Each flow carries tensors, and the tensors are big. When a flow is slow, the accelerator at the other end sits idle, and an idle accelerator is the most expensive thing in the building.

    The standard topology for this fabric is a Clos network. Servers connect to leaf switches. Every leaf connects to every spine. Traffic between two servers on different leaves crosses exactly one spine, so every path has the same length, and the number of equal cost paths is the number of spines. Routing uses a simple underlay, often eBGP with one autonomous system per leaf and a shared autonomous system for the spines. Each switch installs several next hops for a remote prefix and spreads flows over them. This is equal cost multipath, or ECMP.

    ECMP chooses a path by hashing header fields, usually the source and destination addresses, the protocol, and the transport ports. All the packets of one flow hash to the same path, which keeps them in order. This works well when there are many flows, because the law of large numbers evens out the load. It works badly when there are few flows. Two large flows have a fair chance of landing on the same spine while another spine is idle. The hash has low entropy, and the fabric looks congested even though total capacity is plentiful.

    RDMA over Converged Ethernet, version two, carries remote direct memory access inside UDP packets. The destination port is 4791. The source port is chosen by the sender and is often derived from the queue pair number, so it provides the entropy that ECMP needs. Behind the UDP header sits the InfiniBand base transport header, which names the destination queue pair and a packet sequence number. For an RDMA write, the first packet also carries an extended header with the remote virtual address, the remote key, and the total length of the message. The payload follows, and an invariant checksum closes the packet.

    A reliable connection queue pair expects packets in order. If one packet is lost, the receiver notices a gap in the sequence numbers and asks the sender to start again from the gap. This is go back N retransmission. It is simple to implement in hardware, but it makes loss expensive, because one lost packet causes everything after it to be sent twice. Production RoCE fabrics therefore try hard not to lose packets. They mark packets with explicit congestion notification before queues overflow, they let the receiver ask the sender to slow down with congestion notification packets, and some also use priority flow control to pause a link before a buffer fills.

    Large language model inference has two phases that stress a machine in different ways. The first phase, called prefill, reads the whole prompt at once. Every prompt token is processed in parallel, which keeps the matrix units busy, so prefill is limited by compute. While it runs, each attention layer computes a key vector and a value vector for every prompt token and stores them. That store is the key value cache. The second phase, called decode, produces the answer one token at a time. Each step reads the entire cache and the model weights to produce a single new token, and it appends one new key and value to the cache. Decode is limited by memory bandwidth and by the latency of each step.

    Because the two phases want different things, operators have started to run them on different machines. A prefill pool is sized for compute and a decode pool is sized for memory bandwidth, and each can be scaled independently. A long prompt arriving on the prefill pool no longer stalls the streaming answers of other users on the decode pool. The price is that the cache created by prefill must now travel to the machine that will run decode. The cache can be hundreds of megabytes for a long prompt on a large model, and the user is waiting, so the transfer sits directly on the path to the first token.

    The transfer is usually a push or a pull between registered memory regions. The decode side allocates and registers a buffer, and tells the prefill side its address and remote key. The prefill side then issues RDMA writes into that buffer, and the final write carries an immediate value that tells the decode side the data is complete. The switches in between know nothing about attention or tensors. They see UDP packets with a DSCP value, they hash the headers, they queue the packets, and they forward them. The quality of the answer cannot depend on the network, but the time to the first token certainly can.

    Operators measure the cost of this handoff in several ways. The first is the volume of the cache, which grows linearly with the number of prompt tokens, the number of layers, the number of key value heads, the size of each head, and the number of bytes used for each stored number. Grouped query attention reduces the number of key value heads, and storing the cache in a narrower number format halves its size again. The second is the time spent waiting for the network, which depends on the bandwidth that one flow can actually obtain, not on the bandwidth printed on the port. A flow that is hashed onto a busy spine, or that suffers loss and must retransmit, sees only a fraction of the line rate. The third is how much of the transfer can be hidden behind computation. If the prefill machine sends each layer as soon as that layer is finished, the network works while the processors continue with the next layer, and only the tail of the transfer is exposed to the user.

    None of these costs can be seen from inside the model. They appear in the counters of the switches, in the retransmission statistics of the network cards, and in the timestamps of the packets. That is why a lab that moves a real cache between two real processes across a real routed fabric is useful. It lets an engineer change one variable at a time, such as the prompt length, the number of queue pairs, the sending rate, or the delay between the leaves, and watch what happens to the first token. It also gives a way to check, with a byte checksum and a comparison of the generated tokens, that the answer produced after the handoff is exactly the answer that would have been produced without it.

    Finally, there is the matter of failure. Links go down, optics fail, and switches reboot. A reliable connection will time out and retransmit, and as long as another path exists the transfer will complete, but the request that was in flight will see a stall. A good test of any fabric designed for inference is to remove a spine link in the middle of a transfer and measure how long the user waits, and whether the tokens that follow are still correct.

---
